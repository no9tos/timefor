name: Release

# Builds a signed release APK and publishes a GitHub release, either when a tag like v1.2.3 is
# pushed or when the workflow is run by hand with a version number (the tag is then created).
# Needs the signing secrets described in RELEASING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.2.3"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TIMEFOR_KEYSTORE_BASE64: ${{ secrets.TIMEFOR_KEYSTORE_BASE64 }}
      TIMEFOR_KEYSTORE_PASSWORD: ${{ secrets.TIMEFOR_KEYSTORE_PASSWORD }}
      TIMEFOR_KEY_ALIAS: ${{ secrets.TIMEFOR_KEY_ALIAS }}
      TIMEFOR_KEY_PASSWORD: ${{ secrets.TIMEFOR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version and secrets
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got $tag"
            exit 1
          fi
          for name in TIMEFOR_KEYSTORE_BASE64 TIMEFOR_KEYSTORE_PASSWORD TIMEFOR_KEY_ALIAS TIMEFOR_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set. See RELEASING.md."
              exit 1
            fi
          done
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "TIMEFOR_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Restore signing key
        run: |
          echo "$TIMEFOR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "TIMEFOR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk timefor.apk
          gh release create "$RELEASE_TAG" timefor.apk \
            --target "$GITHUB_SHA" \
            --title "Timefor $TIMEFOR_VERSION" \
            --generate-notes \
            --latest

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
