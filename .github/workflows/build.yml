name: Build

# Checks that every change compiles and keeps a debug APK for testing.
# Published versions come from release.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Unsigned here; catches code-shrinking and release lint problems before a real release.
      - name: Check release build
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: timefor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
