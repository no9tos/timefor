name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: timefor-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Keeps a permanent link to the newest APK:
      # https://github.com/<owner>/<repo>/releases/download/latest/timefor.apk
      - name: Publish to the "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk timefor.apk
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --title "Timefor (latest build)" --notes "Latest build."
          fi
          gh release upload latest timefor.apk --clobber
          gh release edit latest --notes "Built automatically from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Download timefor.apk and install it over the previous version."
